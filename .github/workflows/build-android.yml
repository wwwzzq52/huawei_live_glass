name: Build Liquid Glass Huawei APK

on:
  push:
    branches: [ liquid-glass-huawei ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licenses & install platform/build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-huawei-apk
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload debug APK (fallback)
        if: ${{ failure() }}
        run: ./gradlew :androidApp:assembleDebug --no-daemon || true

      - name: Upload debug APK artifact
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-huawei-apk-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
